name: Refresh site data

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch GitHub and Stripe data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Restricted Stripe keys, read-only "Balance" permission. Unset secrets are skipped.
          STRIPE_KEY_INVITEO: ${{ secrets.STRIPE_KEY_INVITEO }}
          STRIPE_KEY_CREATORPAY: ${{ secrets.STRIPE_KEY_CREATORPAY }}
          STRIPE_KEY_SCOPELOCK: ${{ secrets.STRIPE_KEY_SCOPELOCK }}
          STRIPE_KEY_STOXX: ${{ secrets.STRIPE_KEY_STOXX }}
        run: python scripts/refresh_data.py

      - name: Test
        run: |
          python -m unittest discover -s test
          node --test test/

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "chore: refresh site data"
          git push
